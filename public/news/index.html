    </div>
    
    <p id="no-news" class="no-news-message" style="display: none;">No news available at the moment. Please check back later.</p>
</div>

<script>
fetch("/news.json")
    .then(response => response.json())
    .then(news => {
        let newsList = document.getElementById("news-list");
        let noNewsMessage = document.getElementById("no-news");

        if (news.length === 0) {
            noNewsMessage.style.display = "block";
        } else {
            news.forEach((article, index) => {
                let newsItem = `
                    <div class="news-item">
                        <a href="http://localhost:1313/news/${index}" class="news-link">
                            <img src="${article.urlToImage || '/default-image.jpg'}" alt="${article.title}" class="news-img">
                            <h2 class="news-title">${article.title}</h2>
                        </a>
                        <p class="news-author">By ${article.author || 'Unknown'}</p>
                        <p class="news-description">${article.description || 'No description available.'}</p>
                    </div>
                `;
                newsList.innerHTML += newsItem;
            });
        }
    })
    .catch(error => {
        document.getElementById("no-news").innerText = "Error loading news. Please try again later.";
        document.getElementById("no-news").style.display = "block";
        console.error("❌ Error loading news:", error);
    });
</script>

    <script>
        document.getElementById("subscribeForm").addEventListener("submit", async (e) => {
          e.preventDefault();
          const email = document.getElementById("email").value.trim();
          const responseMessage = document.getElementById("responseMessage");
      
          
          const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
          if (!emailPattern.test(email)) {
            responseMessage.innerHTML = "Enter a valid email address.";
            responseMessage.style.color = "red";
            return;
          }
      
          responseMessage.innerHTML = "Checking...";
          responseMessage.style.color = "green";
      
          try {
            
            const checkResponse = await fetch(
              `https://sheetdb.io/api/v1/w7eydswfjd972/search?Email=${encodeURIComponent(email)}`
            )
            
            if (!checkResponse.ok) throw new Error("Check failed");
            
            const existingData = await checkResponse.json();
            console.log("API Response:", existingData); 
            
            if (existingData.length > 0) {
              responseMessage.innerHTML = "Email already subscribed!";
              responseMessage.style.color = "red";
              return;
            }
      
            
            responseMessage.innerHTML = "Submitting...";
            const postResponse = await fetch("https://sheetdb.io/api/v1/w7eydswfjd972", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                data: [{ 
                  Email: email, 
                  Joined_at: new Date().toLocaleString() 
                }]
              }),
            });
      
            if (postResponse.ok) {
              responseMessage.innerHTML = "Subscription successful!";
              responseMessage.style.color = "green";
            } else {
              responseMessage.innerHTML = "Error. Try again.";
              responseMessage.style.color = "red";
            }
          } catch (error) {
            responseMessage.innerHTML = "Failed to submit. Please try again.";
            responseMessage.style.color = "red";
          }
        });
      </script>
