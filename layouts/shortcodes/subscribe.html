<div class="subscribe-form">
    <p>Subscribe to our newsletter and get exclusive tips delivered to your inbox</p>
    <form id="subscribeForm">
      <input type="email" name="email" placeholder="Enter your email here" required id="email">
      <button type="submit">Subscribe Now</button>
      <p id="responseMessage"></p>
    </form>
  </div>
  
  <script>
    document.getElementById("subscribeForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      const responseMessage = document.getElementById("responseMessage");
  
      // Validation
      const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailPattern.test(email)) {
        responseMessage.innerHTML = "Enter a valid email address.";
        responseMessage.style.color = "red";
        return;
      }
  
      responseMessage.innerHTML = "Submitting...";
      responseMessage.style.color = "green";
  
      try {
        // Send data to Netlify Function
        const response = await fetch("/.netlify/functions/submit", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email }),
        });
  
        const result = await response.json(); // Parse JSON response
        if (result.success) {
          responseMessage.innerHTML = "Subscription successful!";
        } else {
          responseMessage.innerHTML = "Error. Try again.";
          responseMessage.style.color = "red";
        }
      } catch (error) {
        responseMessage.innerHTML = "Failed to submit. Please try again.";
        responseMessage.style.color = "red";
      }
    });
  </script>
