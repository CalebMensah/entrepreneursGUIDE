{{ define "main" }}
<div class="news-container">
    <h1 class="news-header">Latest Business News</h1>
    <div class="news-grid">
        {{ range .Paginator.Pages }}
        <div class="news-item">
            <a href="{{ .Permalink }}" class="news-link">
                <img src="{{ .Params.image }}" alt="{{ .Title }}" class="news-img">
                <h2 class="news-title">{{ .Title }}</h2>
            </a>
            <p class="news-author">By {{ .Params.author }}</p>
            <p class="news-description">{{ .Params.description }}</p>
        </div>
        {{ end }}
    </div>

    <!-- Pagination -->
    <div class="pagination">
        {{ if .Paginator.HasPrev }}
        <a href="{{ .Paginator.Prev.URL }}" class="page-link">← Previous</a>
        {{ end }}
        {{ if .Paginator.HasNext }}
        <a href="{{ .Paginator.Next.URL }}" class="page-link">Next →</a>
        {{ end }}
    </div>
</div>
{{ end }}
