<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title}}</title>

    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/morestyles.css">

    <script src="https://kit.fontawesome.com/8749291112.js" crossorigin="anonymous"></script>

    <script async src='https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2859143237615606'crossorigin='anonymous'></script>
     <meta name='google-adsense-account' content='ca-pub-2859143237615606'>

     <script type="application/ld+json">
      {
          "@context": "https://schema.org",
          "@type":"Article",
          "mainEntityOfPage": {
              "@type": "webPage",
              "@id": {{ .Permalink }}
          },
          "headline": "{{ .Title }}",
          "image": [
          "{{ .Params.image }}"
          ],
          "datePublished": "{{ .Date.Format "2006-1-02T15:04:05Z" }}",
          "dateModified": "{{.Lastmod.Format "2006-1-02T15:04:05Z" }}",
          "author": {
              "@type": 'Organization',
              "name": "businessMasters",
              "logo": {
                  "@type": "ImageObject",
                  "url": "/images/logo1.png",
                  "width": 192,
                  "height": 60
              }
          },
          "description": "{{ .Description }}"
      }
  </script>

    
</head>
<body>

    <header>
        <img src="/images/logo.webp" alt="businessmasters" loading="lazy">
        <button class="toggle-menu" aria-label="Toggle menu">
            &#9776
        </button>
        <nav class="nav-links">
            <a href="/">Home</a>
            <a href="/post">Post</a>
            <a href="/news">News</a>
            <a href="/about">About</a>
            <a href="/contact">Contact Us</a>
        </nav>
    </header>

   
    
    <main class="wrapper">
        {{block "main" .}}{{ end }}
    </main>

    <footer>
        <!-- Subscription form -->
        <div class="subscribe-form1">
          <p>Subscribe to our newsletter and get exclusive tips delivered to your inbox</p>
          <form id="subscribeForm" action="https://formsubmit.co/https://script.google.com/macros/s/AKfycbzp1KAJTYD0DAz1KzxytxmSQbnXt34yZ-KqWTHphAuE8X2LwkiX6iQMQuAS28CQa19R/exec" method="POST">
          <input type="email" name="email" placeholder="Enter your email here"/>
          <button type="submit">Subscribe Now</button>
          </form>
          </div>
          
          <div class="icons">
            <a href="https://www.facebook.com/businessmasters"><i class="fa-brands fa-facebook"></i></a>
           <a href="https://www.instagram.com/businessmasters.gh"> <i class="fa-brands fa-instagram"></i></a>
            <a href="https://tiktok.com/@businessmasters5"><i class="fa-brands fa-tiktok"></i></a>
            <a href=""><i class="fa-brands fa-x-twitter"></i></a>
          </div>

          <p>&copy; 2024 entrepreneursGUIDE</p>
    </footer>

    <!---
      <div id="loading-spinner" class="spinner-overlay">
    <div class="spinner"></div>
  </div>
    -->
    
    <script src="/js/script.js" type="module"></script>
</body>
</html>
