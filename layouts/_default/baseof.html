<!DOCTYPE html>

    <script src="https://cdn.onesignal.com/sdks/OneSignalSDK.js" async=""></script>

    <script>

// Initialize OneSignal
window.OneSignal = window.OneSignal || [];
OneSignal.push(async function() {
    try {
        await OneSignal.init({
            appId: "3684ab0f-136e-404a-ab10-8206040c0129", // Replace with your OneSignal App ID
            allowLocalhostAsSecureOrigin: true, // Optional: For testing on localhost
            notifyButton: { enable: true }, // Enable the default notification prompt
            promptOptions: {autoPrompt: false}
        });

        console.log("OneSignal initialized successfully");

        // Check if the user is already subscribed
        const isSubscribed = await OneSignal.isPushNotificationsEnabled();
        console.log("Notification enabled:", isSubscribed);

        if(!isSubscribed) {
          console.log("showing notification prompt")
          setTimeout(() => {
            OneSignal.showSlidedownPrompt()
          }, 3000)
        }

        // Retrieve the user's player ID
        const userId = await OneSignal.getUserId();
        console.log("OneSignal User ID:", userId);
    } catch (error) {
        console.error("OneSignal Initialization Error:", error);
    }
});

// Handle subscription changes
OneSignal.push(function() {
    OneSignal.on('subscriptionChange', function(isSubscribed) {
        if (isSubscribed) {
            console.log("User subscribed to notifications");
        } else {
            console.log("User unsubscribed from notifications");
        }
    });
});

    </script>

    <script>
        document.getElementById("subscribeForm").addEventListener("submit", async (e) => {
          e.preventDefault();
          const email = document.getElementById("email").value.trim();
          const responseMessage = document.getElementById("responseMessage");
      
          // Email validation
          const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
          if (!emailPattern.test(email)) {
            responseMessage.innerHTML = "Enter a valid email address.";
            responseMessage.style.color = "red";
            return;
          }
      
          responseMessage.innerHTML = "Checking...";
          responseMessage.style.color = "green";
      
          try {
            // Check if email already exists
            const checkResponse = await fetch(
              `https://sheetdb.io/api/v1/w7eydswfjd972/search?Email=${encodeURIComponent(email)}`
            )
            
            if (!checkResponse.ok) throw new Error("Check failed");
            
            const existingData = await checkResponse.json();
            console.log("API Response:", existingData); // Add this log to see the API response
            
            if (existingData.length > 0) {
              responseMessage.innerHTML = "Email already subscribed!";
              responseMessage.style.color = "red";
              return;
            }
      
            // Proceed to submit if email is new
            responseMessage.innerHTML = "Submitting...";
            const postResponse = await fetch("https://sheetdb.io/api/v1/w7eydswfjd972", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                data: [{ 
                  Email: email, 
                  Joined_at: new Date().toLocaleString() // Fixed typo (toLocalString → toLocaleString)
                }]
              }),
            });
      
            if (postResponse.ok) {
              responseMessage.innerHTML = "Subscription successful!";
              responseMessage.style.color = "green";
            } else {
              responseMessage.innerHTML = "Error. Try again.";
              responseMessage.style.color = "red";
            }
          } catch (error) {
            responseMessage.innerHTML = "Failed to submit. Please try again.";
            responseMessage.style.color = "red";
          }
        });
      </script>
    
    <script src="/js/script.js"></script>
</body>
