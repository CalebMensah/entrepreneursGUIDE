name: Fetch News and Update Hugo Site

on:
  schedule:
    - cron: "0 */6 * * *" # Runs every 6 hours
  workflow_dispatch: # Allows manual trigger from GitHub Actions

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Fetch News
        run: node fetchNews.js

      - name: Commit and Push Changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add content/news.json
          git commit -m "Updated news feed" || echo "No changes to commit"
          git push

      - name: Trigger Netlify Deployment
        run: curl -X POST -d {} "https://api.netlify.com/build_hooks/67ac94a272816b3c58cb328e"
