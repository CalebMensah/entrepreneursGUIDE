name: Fetch Latest News & Deploy to Netlify

on:
  schedule:
    - cron: "0 */4 * * *"  # Runs every 4 hours
  workflow_dispatch:  # Allows manual triggering

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install  # Ensure you have dependencies installed

      - name: Fetch latest news
        run: node fetchnews.js  # Runs your script to fetch and save news

      - name: Commit and push if changed
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add content/news static/news.json
          git diff --quiet && git diff --staged --quiet || git commit -m "🔄 Auto-update news"
          git push

      - name: Trigger Netlify Build
        run: |
          curl -X POST -d '{}' "https://api.netlify.com/build_hooks/67ac94a272816b3c58cb328e"
          
